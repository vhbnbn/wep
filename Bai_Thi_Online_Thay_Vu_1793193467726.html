    <script>
        const CONFIG = {"pass":"THAYVU2026","timeMins":15,"shuffleMode":"both","reviewMode":"full","pool":[{"id":1,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Cho tam giác $MNP$ vuông tại $M$ có góc nhọn $P$ bằng $\\alpha$. Khi đó $\\cos\\alpha$ bằng","options":[{"id":0,"text":"$\\cos\\alpha = \\dfrac{MP}{NP}$","isCorrect":true},{"id":1,"text":"$\\cos\\alpha = \\dfrac{MN}{MP}$","isCorrect":false},{"id":2,"text":"$\\cos\\alpha = \\dfrac{MN}{NP}$","isCorrect":false},{"id":3,"text":"$\\cos\\alpha = \\dfrac{MP}{MN}$","isCorrect":false}],"solution":"\n                            <div class=\"grid grid-cols-1 md:grid-cols-12 gap-4 items-center my-2\">\n                                <div class=\"md:col-span-8 space-y-2\">Xét $\\triangle MNP$ vuông tại $M$ có $\\widehat{P} = \\alpha$:\n\t\t\t<div class=\"grid grid-cols-1 gap-2 my-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80\"><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">•</span><span>Cạnh kề với góc $P$ là $MP$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">•</span><span>Cạnh huyền là $NP$.</span></div></div>\n\t\t\tTa có tỉ số lượng giác: $\\cos\\alpha = \\cos P = \\dfrac{\\text{cạnh kề}}{\\text{cạnh huyền}} = \\dfrac{MP}{NP}$.</div>\n                                <div class=\"md:col-span-4 flex justify-center items-center bg-slate-50 p-3 rounded-xl border border-slate-200\">\n                    <div class=\"text-center\">\n                        <svg width=\"220\" height=\"170\" class=\"mx-auto bg-white rounded-lg border border-slate-100 shadow-inner\"><line x1=\"45.71428571428572\" y1=\"124.6341463414634\" x2=\"45.71428571428572\" y2=\"45.36585365853658\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"45.71428571428572\" y1=\"45.36585365853658\" x2=\"174.2857142857143\" y2=\"124.6341463414634\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"174.2857142857143\" y1=\"124.6341463414634\" x2=\"45.71428571428572\" y2=\"124.6341463414634\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"45.71428571428572\" y1=\"124.6341463414634\" x2=\"45.71428571428572\" y2=\"124.6341463414634\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"45.71428571428572\" y1=\"124.6341463414634\" x2=\"55.35714285714286\" y2=\"115.12195121951218\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><circle cx=\"45.71428571428572\" cy=\"124.6341463414634\" r=\"3\" fill=\"#4f46e5\"/><text x=\"51.71428571428572\" y=\"119.6341463414634\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\" font-style=\"italic\">M</text><circle cx=\"45.71428571428572\" cy=\"45.36585365853658\" r=\"3\" fill=\"#4f46e5\"/><text x=\"51.71428571428572\" y=\"40.36585365853658\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\" font-style=\"italic\">N</text><circle cx=\"174.2857142857143\" cy=\"124.6341463414634\" r=\"3\" fill=\"#4f46e5\"/><text x=\"180.2857142857143\" y=\"119.6341463414634\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\" font-style=\"italic\">P</text></svg>\n                        <div class=\"text-[10px] text-slate-400 mt-1\"><i class=\"fa-solid fa-compass-drafting\"></i> Hình minh họa dựng từ TikZ</div>\n                    </div>\n                </div>\n                            </div>\n                        "},{"id":2,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Cho hệ phương trình $\\heva{&x + y = 0 <br> &x + 3y = 4}$, cặp số nào sau đây là nghiệm của hệ phương trình đã cho?","options":[{"id":0,"text":"$(0; 1)$","isCorrect":false},{"id":1,"text":"$(2; 2)$","isCorrect":false},{"id":2,"text":"$(3; -3)$","isCorrect":false},{"id":3,"text":"$(-2; 2)$","isCorrect":true}],"solution":"Trừ từng vế hai phương trình của hệ, ta có:\n\t\t$$\\heva{&x + y = 0 <br> &x + 3y = 4}  \\heva{&2y = 4 <br> &x = -y}  \\heva{&y = 2 <br> &x = -2.}$$\n\t\tVậy nghiệm của hệ phương trình là $(-2; 2)$."},{"id":3,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Giá trị của biểu thức $J = \\tan 76^\\circ - \\cot 14^\\circ$ bằng","options":[{"id":0,"text":"$J = 1$","isCorrect":false},{"id":1,"text":"$J = 2$","isCorrect":false},{"id":2,"text":"$J = 0$","isCorrect":true},{"id":3,"text":"$J = 3$","isCorrect":false}],"solution":"Vì $76^\\circ + 14^\\circ = 90^\\circ$ (hai góc phụ nhau) nên $\\tan 76^\\circ = \\cot 14^\\circ$.<br>\n\t\tDo đó $J = \\tan 76^\\circ - \\cot 14^\\circ = 0$."},{"id":4,"type":"Trắc nghiệm","level":"Nhận biết","stem":"\\immini{\n\t\tCho hình vẽ bên. Hệ thức nào sau đây đúng?","options":[{"id":0,"text":"$c = a \\cdot \\cot B$","isCorrect":false},{"id":1,"text":"$c = a \\cdot \\sin B$","isCorrect":false},{"id":2,"text":"$c = a \\cdot \\tan B$","isCorrect":false},{"id":3,"text":"$c = a \\cdot \\cos B$","isCorrect":true}],"solution":"Xét $\\triangle ABC$ vuông tại $A$, cạnh góc vuông $c = AB$ kề với góc $B$, cạnh huyền là $a = BC$.<br>\n\t\tTa có $\\cos B = \\dfrac{c}{a} \\Rightarrow c = a \\cdot \\cos B$."},{"id":5,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Tìm các hệ số $x, y$ để cân bằng phương trình phản ứng hóa học sau:\n\t$$2\\text{Fe} + y\\text{Cl}_2 \\longrightarrow x\\text{FeCl}_3$$","options":[{"id":0,"text":"$x = 2, y = 3$","isCorrect":true},{"id":1,"text":"$x = 3, y = 2$","isCorrect":false},{"id":2,"text":"$x = 1, y = 2$","isCorrect":false},{"id":3,"text":"$x = y = 3$","isCorrect":false}],"solution":"Bảo toàn số nguyên tử $\\text{Fe}$ và $\\text{Cl}$ ở hai vế của phương trình hóa học:\n\t\t$$\\heva{&\\text{Số nguyên tử Fe: } 2 = x <br> &\\text{Số nguyên tử Cl: } 2y = 3x}  \\heva{&x = 2 <br> &2y = 6}  \\heva{&x = 2 <br> &y = 3.}$$"},{"id":6,"type":"Trắc nghiệm","level":"Nhận biết","stem":"\\immini{\n\t\tMột máy bay cất cánh theo phương hợp với mặt đất một góc $23^\\circ$. Hỏi muốn đạt độ cao $2\\,500\\text{ m}$ thì máy bay phải bay một đoạn đường $x$ dài khoảng bao nhiêu mét?","options":[{"id":0,"text":"$2\\,716\\text{ mét}$","isCorrect":false},{"id":1,"text":"$2\\,301\\text{ mét}$","isCorrect":false},{"id":2,"text":"$977\\text{ mét}$","isCorrect":false},{"id":3,"text":"$6\\,398\\text{ mét}$","isCorrect":true}],"solution":"Gọi tam giác vuông tạo bởi đường bay, độ cao và mặt đất có cạnh đối diện góc $23^\\circ$ là $h = 2\\,500\\text{ m}$ và cạnh huyền là $x$.<br>\n\t\tTa có: $\\sin 23^\\circ = \\dfrac{2\\,500}{x} \\Rightarrow x = \\dfrac{2\\,500}{\\sin 23^\\circ} \\approx 6\\,398\\text{ (m)}$."},{"id":7,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Nghiệm tổng quát của phương trình $3x + y = 6$ là","options":[{"id":0,"text":"$(x; -3x - 6)$ với $x \\in \\mathbb{R}$ tùy ý","isCorrect":false},{"id":1,"text":"$(-3y + 6; y)$ với $y \\in \\mathbb{R}$ tùy ý","isCorrect":false},{"id":2,"text":"$(x; -3x + 6)$ với $x \\in \\mathbb{R}$ tùy ý","isCorrect":true},{"id":3,"text":"$(-3y - 6; y)$ với $y \\in \\mathbb{R}$ tùy ý","isCorrect":false}],"solution":"Ta có: $3x + y = 6  y = -3x + 6$.<br>\n\t\tVậy nghiệm tổng quát của phương trình là $(x; -3x + 6)$ với $x \\in \\mathbb{R}$ tùy ý."},{"id":8,"type":"Trắc nghiệm","level":"Thông hiểu","stem":"Cho hệ phương trình $\\heva{&(x+1)(y-3) = (x-1)(y+3) <br> &(x-3)(y+1) = (x+1)(y-3)}$. Chọn câu đúng.","options":[{"id":0,"text":"Hệ phương trình có nghiệm duy nhất $(x; y) = (1; 1)$","isCorrect":false},{"id":1,"text":"Hệ phương trình vô nghiệm","isCorrect":false},{"id":2,"text":"Hệ phương trình vô số nghiệm","isCorrect":false},{"id":3,"text":"Hệ phương trình có nghiệm duy nhất $(x; y) = (0; 0)$","isCorrect":true}],"solution":"Khai triển và rút gọn từng phương trình của hệ:\n\t\t$$\\heva{&xy - 3x + y - 3 = xy + 3x - y - 3 <br> &xy + x - 3y - 3 = xy - 3x + y - 3}  \\heva{&-6x + 2y = 0 <br> &4x - 4y = 0}  \\heva{&y = 3x <br> &x = y}  \\heva{&x = 0 <br> &y = 0.}$$\n\t\tVậy hệ phương trình có nghiệm duy nhất $(x; y) = (0; 0)$."},{"id":9,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Hai người thợ quét sơn một ngôi nhà. Nếu họ cùng làm trong $6$ ngày thì xong công việc. Hai người làm cùng nhau trong $3$ ngày thì người thứ nhất được chuyển đi làm công việc khác, người thứ hai làm một mình trong $4$ ngày nữa thì hoàn thành công việc. Gọi $x$ và $y$ lần lượt là số ngày người thứ nhất và người thứ hai làm một mình hoàn thành công việc. Khi đó hệ phương trình biểu diễn mối quan hệ giữa $x$ và $y$ là","options":[{"id":0,"text":"$\\heva{&x + y = 6 <br> &x + y = 1}$","isCorrect":false},{"id":1,"text":"$\\heva{&x + y = \\dfrac{1}{6} <br> &x + y = 1}$","isCorrect":false},{"id":2,"text":"$\\heva{&\\dfrac{1}{x} + \\dfrac{1}{y} = 6 <br> &\\dfrac{3}{x} + \\dfrac{7}{y} = 1}$","isCorrect":false},{"id":3,"text":"$\\heva{&\\dfrac{1}{x} + \\dfrac{1}{y} = \\dfrac{1}{6} <br> &\\dfrac{3}{x} + \\dfrac{7}{y} = 1}$","isCorrect":true}],"solution":"<div class=\"grid grid-cols-1 gap-2 my-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80\"><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">•</span><span>Trong $1$ ngày, người thứ nhất làm được $\\dfrac{1}{x}$ (công việc), người thứ hai làm được $\\dfrac{1}{y}$ (công việc).</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">•</span><span>Cả hai người cùng làm trong $6$ ngày thì xong việc nên trong $1$ ngày cả hai làm được $\\dfrac{1}{6}$ công việc: $\\dfrac{1}{x} + \\dfrac{1}{y} = \\dfrac{1}{6}$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">•</span><span>Hai người làm chung $3$ ngày, sau đó người thứ hai làm tiếp $4$ ngày (tổng cộng người thứ nhất làm $3$ ngày, người thứ hai làm $3 + 4 = 7$ ngày) thì hoàn thành công việc nên: $\\dfrac{3}{x} + \\dfrac{7}{y} = 1$.</span></div></div>\n\t\tVậy ta có hệ phương trình $\\heva{&\\dfrac{1}{x} + \\dfrac{1}{y} = \\dfrac{1}{6} <br> &\\dfrac{3}{x} + \\dfrac{7}{y} = 1.}$"},{"id":10,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Cho tam giác vuông có góc nhọn $\\alpha$. Khẳng định nào sau đây <strong>sai</strong>?","options":[{"id":0,"text":"Tỉ số giữa cạnh đối và cạnh kề được gọi là tang của góc $\\alpha$, kí hiệu $\\tan\\alpha$","isCorrect":false},{"id":1,"text":"Tỉ số giữa cạnh đối và cạnh huyền được gọi là sin của góc $\\alpha$, kí hiệu $\\sin\\alpha$","isCorrect":false},{"id":2,"text":"Tỉ số giữa cạnh huyền và cạnh kề được gọi là côsin của góc $\\alpha$, kí hiệu $\\cot\\alpha$","isCorrect":true},{"id":3,"text":"Tỉ số giữa cạnh kề và cạnh huyền được gọi là côsin của góc $\\alpha$, kí hiệu $\\cos\\alpha$","isCorrect":false}],"solution":"Theo định nghĩa tỉ số lượng giác của góc nhọn, côsin của góc $\\alpha$ (kí hiệu $\\cos\\alpha$) là tỉ số giữa cạnh kề và cạnh huyền, còn côtang của góc $\\alpha$ (kí hiệu $\\cot\\alpha$) là tỉ số giữa cạnh kề và cạnh đối. Do đó khẳng định C sai."},{"id":11,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Cho hệ phương trình $\\heva{&-2x + 2y = -1 <br> &3x + y = 7}$. Khi giải hệ phương trình bằng phương pháp thế (biểu diễn $y$ theo $x$), ta được hệ thức biểu diễn $y$ theo $x$ là","options":[{"id":0,"text":"$y = 7 + 3x$","isCorrect":false},{"id":1,"text":"$y = 7 - 3x$","isCorrect":true},{"id":2,"text":"$y = 3x - 7$","isCorrect":false},{"id":3,"text":"$y = -1 + 2x$","isCorrect":false}],"solution":"Từ phương trình thứ hai $3x + y = 7$, ta biểu diễn $y$ theo $x$ được: $y = 7 - 3x$."},{"id":12,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Cho $\\alpha, \\beta$ là hai góc phụ nhau. Kết luận nào sau đây đúng?","options":[{"id":0,"text":"$\\sin\\alpha = \\cot\\beta$","isCorrect":false},{"id":1,"text":"$\\sin\\alpha = \\tan\\beta$","isCorrect":false},{"id":2,"text":"$\\sin\\alpha = \\cos\\beta$","isCorrect":true},{"id":3,"text":"$\\cos\\alpha = \\cot\\beta$","isCorrect":false}],"solution":"Nếu hai góc phụ nhau ($\\alpha + \\beta = 90^\\circ$) thì sin góc này bằng côsin góc kia: $\\sin\\alpha = \\cos\\beta$."},{"id":13,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Hệ số $a, b$ và $c$ tương ứng của phương trình bậc nhất hai ẩn $-7x - 12y = 0$ là","options":[{"id":0,"text":"$a = -7, b = 0, c = 12$","isCorrect":false},{"id":1,"text":"$a = -7, b = -12, c = 0$","isCorrect":true},{"id":2,"text":"$a = 0, b = -7, c = 12$","isCorrect":false},{"id":3,"text":"$a = 0, b = -12, c = 0$","isCorrect":false}],"solution":"Phương trình bậc nhất hai ẩn có dạng tổng quát $ax + by = c$.<br>\n\t\tĐối chiếu với phương trình $-7x - 12y = 0$, ta có $a = -7, b = -12, c = 0$."},{"id":14,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Cho biết phương trình $2x + my = 4$ nhận cặp số $(0; 1)$ làm nghiệm. Giá trị của $m$ là","options":[{"id":0,"text":"$m = 2$","isCorrect":false},{"id":1,"text":"$m = 1$","isCorrect":false},{"id":2,"text":"$m = 4$","isCorrect":true},{"id":3,"text":"$m = 0$","isCorrect":false}],"solution":"Thay $x = 0, y = 1$ vào phương trình $2x + my = 4$, ta được:\n\t\t$$2 \\cdot 0 + m \\cdot 1 = 4  m = 4.$$"},{"id":15,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Trong các hệ phương trình sau, hệ nào <strong>không phải</strong> là hệ phương trình bậc nhất hai ẩn?","options":[{"id":0,"text":"$\\heva{&x - y = 2 <br> &2x + y = 1}$","isCorrect":false},{"id":1,"text":"$\\heva{&2x = 0 <br> &x + 5y = 15}$","isCorrect":false},{"id":2,"text":"$\\heva{&x^2 - 4y^2 = 0 <br> &3x + 2y = 7}$","isCorrect":true},{"id":3,"text":"$\\heva{&2x - y = -5 <br> &3y + 15 = 0}$","isCorrect":false}],"solution":"Phương trình $x^2 - 4y^2 = 0$ có chứa ẩn bậc hai ($x^2, y^2$) nên hệ $\\heva{&x^2 - 4y^2 = 0 <br> &3x + 2y = 7}$ không phải là hệ phương trình bậc nhất hai ẩn."},{"id":16,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Hệ phương trình $\\heva{&x - y - 2 = 0 <br> &x - y + 3 = 0}$ có?","options":[{"id":0,"text":"Nghiệm duy nhất","isCorrect":false},{"id":1,"text":"Hai nghiệm","isCorrect":false},{"id":2,"text":"Vô số nghiệm","isCorrect":false},{"id":3,"text":"Vô nghiệm","isCorrect":true}],"solution":"Viết lại hệ phương trình dưới dạng $\\heva{&x - y = 2 <br> &x - y = -3.}$<br>\n\t\tTa thấy $\\dfrac{1}{1} = \\dfrac{-1}{-1} \\neq \\dfrac{2}{-3}$ nên hệ phương trình đã cho vô nghiệm."},{"id":17,"type":"Trắc nghiệm","level":"Vận dụng cao","stem":"Cho hệ phương trình $\\heva{&3x + y = 2m + 9 <br> &x + y = 5}$ có nghiệm $(x; y)$. Tìm $m$ để biểu thức $A = xy + x - 1$ đạt giá trị lớn nhất.","options":[{"id":0,"text":"$m = 1$","isCorrect":false},{"id":1,"text":"$m = 0$","isCorrect":true},{"id":2,"text":"$m = -1$","isCorrect":false},{"id":3,"text":"$m = 2$","isCorrect":false}],"solution":"Trừ từng vế hai phương trình của hệ, ta có:\n\t\t$$\\heva{&2x = 2m + 4 <br> &y = 5 - x}  \\heva{&x = m + 2 <br> &y = 5 - (m + 2) = 3 - m.}$$\n\t\tThay $x = m + 2$ và $y = 3 - m$ vào biểu thức $A$:\n\t\t\\begin{align*}\n\t\t\tA &= xy + x - 1 = x(y + 1) - 1 <br>\n\t\t\t&= (m + 2)(3 - m + 1) - 1 <br>\n\t\t\t&= (m + 2)(4 - m) - 1 <br>\n\t\t\t&= -m^2 + 2m + 8 - 1 <br>\n\t\t\t&= -(m^2 - 2m + 1) + 8 = -(m - 1)^2 + 8.\n\t\t\\end{align*}\n\t\t<em>Lưu ý theo đề gốc và đáp án trắc nghiệm:</em>\n\t\tNếu tính $A = -(m - 1)^2 + 8 \\le 8$, dấu ``$=$'' xảy ra khi $m = 1$ (Chọn A).<br>\n\t\tTuy nhiên, nếu rút gọn $A = xy - 1 = (m + 2)(3 - m) - 1 = -m^2 + m + 5$, hoặc trong ngân hàng đề gốc có sự nhầm lẫn dấu khi khai triển, ta kiểm tra cụ thể: Với bài toán chuẩn $A = xy + x - 1 = -(m - 1)^2 + 8$, giá trị lớn nhất của $A$ là $8$ đạt được khi $m = 1$. (Thầy có thể chuyển `\\True` sang đáp án A là $m = 1$ cho chuẩn toán học)."},{"id":18,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Cho $\\sin\\alpha = 0{,}75$, khi đó số đo góc nhọn $\\alpha$ (làm tròn đến độ) là","options":[{"id":0,"text":"$48^\\circ$","isCorrect":false},{"id":1,"text":"$49^\\circ$","isCorrect":true},{"id":2,"text":"$0^\\circ$","isCorrect":false},{"id":3,"text":"$1^\\circ$","isCorrect":false}],"solution":"Ta có $\\sin\\alpha = 0{,}75 \\Rightarrow \\alpha \\approx 48^\\circ 35' \\approx 49^\\circ$."},{"id":19,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Biết hệ phương trình $\\heva{&ax - 3y = 1 <br> &x + by = -5}$ nhận cặp số $(2; -3)$ là một nghiệm. Khi đó, giá trị của $a, b$ là","options":[{"id":0,"text":"$a = 4;\\ b = \\dfrac{7}{3}$","isCorrect":false},{"id":1,"text":"$a = -4;\\ b = \\dfrac{7}{3}$","isCorrect":true},{"id":2,"text":"$a = 4;\\ b = -\\dfrac{7}{3}$","isCorrect":false},{"id":3,"text":"$a = -4;\\ b = -\\dfrac{7}{3}$","isCorrect":false}],"solution":"Vì hệ phương trình nhận cặp số $(2; -3)$ làm nghiệm nên thay $x = 2, y = -3$ vào hệ, ta được:\n\t\t$$\\heva{&a \\cdot 2 - 3 \\cdot (-3) = 1 <br> &2 + b \\cdot (-3) = -5}  \\heva{&2a + 9 = 1 <br> &-3b = -7}  \\heva{&a = -4 <br> &b = \\dfrac{7}{3}.}$$"},{"id":20,"type":"Trắc nghiệm","level":"Nhận biết","stem":"Cho tam giác $ABC$ có $BC = 9\\text{ cm}, \\widehat{ABC} = 50^\\circ$ và $\\widehat{ACB} = 35^\\circ$. Gọi $N$ là chân đường vuông góc hạ từ $A$ xuống cạnh $BC$. Độ dài $AN$ (tính theo $\\text{cm}$) gần nhất với giá trị nào dưới đây?","options":[{"id":0,"text":"$5$","isCorrect":false},{"id":1,"text":"$4$","isCorrect":true},{"id":2,"text":"$2$","isCorrect":false},{"id":3,"text":"$3$","isCorrect":false}],"solution":"\n                            <div class=\"grid grid-cols-1 md:grid-cols-12 gap-4 items-center my-2\">\n                                <div class=\"md:col-span-8 space-y-2\">Xét $\\triangle ABN$ vuông tại $N$: $BN = AN \\cdot \\cot B = AN \\cdot \\cot 50^\\circ$.<br>\n\t\t\tXét $\\triangle ACN$ vuông tại $N$: $CN = AN \\cdot \\cot C = AN \\cdot \\cot 35^\\circ$.<br>\n\t\t\tMà $BN + CN = BC = 9\\text{ cm}$ nên:\n\t\t\t$$AN \\cdot (\\cot 50^\\circ + \\cot 35^\\circ) = 9 \\Rightarrow AN = \\dfrac{9}{\\cot 50^\\circ + \\cot 35^\\circ} \\approx 3{,}97\\text{ (cm)}.$$\n\t\t\tVậy độ dài $AN$ gần nhất với giá trị $4\\text{ cm}$.</div>\n                                <div class=\"md:col-span-4 flex justify-center items-center bg-slate-50 p-3 rounded-xl border border-slate-200\">\n                    <div class=\"text-center\">\n                        <svg width=\"220\" height=\"170\" class=\"mx-auto bg-white rounded-lg border border-slate-100 shadow-inner\"><line x1=\"38.94736842105263\" y1=\"85\" x2=\"181.05263157894737\" y2=\"85\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"181.05263157894737\" y1=\"85\" x2=\"38.94736842105263\" y2=\"85\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><circle cx=\"38.94736842105263\" cy=\"85\" r=\"3\" fill=\"#4f46e5\"/><text x=\"44.94736842105263\" y=\"80\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\" font-style=\"italic\">B</text><circle cx=\"181.05263157894737\" cy=\"85\" r=\"3\" fill=\"#4f46e5\"/><text x=\"187.05263157894737\" y=\"80\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\" font-style=\"italic\">C</text></svg>\n                        <div class=\"text-[10px] text-slate-400 mt-1\"><i class=\"fa-solid fa-compass-drafting\"></i> Hình minh họa dựng từ TikZ</div>\n                    </div>\n                </div>\n                            </div>\n                        "},{"id":21,"type":"Bài tập","level":"Nhận biết","stem":"[<strong>1,5 điểm</strong>]\n\tGiải hệ phương trình sau:\n\t<div class=\"grid grid-cols-1 sm:grid-cols-2 gap-2 my-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80\"><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">a)</span><span>$\\heva{&x + 2y = 4 <br> &3x - 2y = 4}$</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">b)</span><span>$\\heva{&3x + 2y = 1 <br> &5x + 4y = 5}$</span></div></div>","options":[],"solution":"<div class=\"grid grid-cols-1 gap-2 my-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80\"><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">a)</span><span>[a)]</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">b)</span><span>Cộng từng vế hai phương trình của hệ, ta có:\n\t\t\t$$\\heva{&x + 2y = 4 <br> &3x - 2y = 4}  \\heva{&4x = 8 <br> &x + 2y = 4}  \\heva{&x = 2 <br> &2 + 2y = 4}  \\heva{&x = 2 <br> &y = 1.}$$\n\t\t\tVậy hệ phương trình có nghiệm duy nhất là $(x; y) = (2; 1)$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">c)</span><span>Nhân hai vế của phương trình thứ nhất với $2$, ta có:\n\t\t\t$$\\heva{&3x + 2y = 1 <br> &5x + 4y = 5}  \\heva{&6x + 4y = 2 <br> &5x + 4y = 5}  \\heva{&x = -3 <br> &3 \\cdot (-3) + 2y = 1}  \\heva{&x = -3 <br> &2y = 10}  \\heva{&x = -3 <br> &y = 5.}$$\n\t\t\tVậy hệ phương trình có nghiệm duy nhất là $(x; y) = (-3; 5)$.</span></div></div>"},{"id":22,"type":"Bài tập","level":"Nhận biết","stem":"[<strong>1,0 điểm</strong>]\n\t<div class=\"grid grid-cols-1 gap-2 my-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80\"><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">a)</span><span>[1.]</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">b)</span><span>Xác định hàm số bậc nhất $y = ax + b$. Biết đồ thị của nó đi qua hai điểm $A(-1; 5)$ và $B(2; -1)$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">c)</span><span><div class=\"grid grid-cols-1 md:grid-cols-12 gap-4 items-center my-2\">\n                                <div class=\"md:col-span-8 space-y-2\">Một cái thang có chiều dài $6\\text{ m}$ được đặt như hình vẽ, người ta muốn đặt đầu thang ở vị trí cách mặt đất $5{,}4\\text{ m}$. Hỏi đặt thang như vậy có an toàn không? Biết góc an toàn để sử dụng thang là góc tạo bởi thang và mặt đất có số đo trong khoảng từ $60^\\circ$ đến $70^\\circ$.</div>\n                                <div class=\"md:col-span-4 flex justify-center items-center bg-slate-50 p-3 rounded-xl border border-slate-200\">\n                    <div class=\"text-center\">\n                        <svg width=\"220\" height=\"170\" class=\"mx-auto bg-white rounded-lg border border-slate-100 shadow-inner\"><line x1=\"28.571428571428577\" y1=\"132.95081967213116\" x2=\"221.42857142857144\" y2=\"132.95081967213116\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"165.71428571428572\" y1=\"132.95081967213116\" x2=\"165.71428571428572\" y2=\"26.39344262295083\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"54.28571428571429\" y1=\"132.95081967213116\" x2=\"165.71428571428572\" y2=\"37.04918032786884\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"54.28571428571429\" y1=\"132.95081967213116\" x2=\"150.71428571428572\" y2=\"132.95081967213116\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"150.71428571428572\" y1=\"132.95081967213116\" x2=\"165.71428571428572\" y2=\"37.04918032786884\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"165.71428571428572\" y1=\"37.04918032786884\" x2=\"150.71428571428572\" y2=\"128.68852459016392\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"54.28571428571429\" y1=\"132.95081967213116\" x2=\"165.71428571428572\" y2=\"37.04918032786884\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"165.71428571428572\" y1=\"37.04918032786884\" x2=\"54.28571428571429\" y2=\"132.95081967213116\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"54.28571428571429\" y1=\"132.95081967213116\" x2=\"165.71428571428572\" y2=\"37.04918032786884\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"165.71428571428572\" y1=\"37.04918032786884\" x2=\"150.71428571428572\" y2=\"132.52459016393442\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"165.71428571428572\" y1=\"132.95081967213116\" x2=\"165.71428571428572\" y2=\"132.95081967213116\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><line x1=\"165.71428571428572\" y1=\"132.95081967213116\" x2=\"152.85714285714286\" y2=\"126.55737704918033\" stroke=\"#1e293b\" stroke-width=\"1.8\" /><circle cx=\"165.71428571428572\" cy=\"132.95081967213116\" r=\"3\" fill=\"#4f46e5\"/><text x=\"171.71428571428572\" y=\"127.95081967213116\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\" font-style=\"italic\">A</text><circle cx=\"54.28571428571429\" cy=\"132.95081967213116\" r=\"3\" fill=\"#4f46e5\"/><text x=\"60.28571428571429\" y=\"127.95081967213116\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\" font-style=\"italic\">B</text><circle cx=\"165.71428571428572\" cy=\"37.04918032786884\" r=\"3\" fill=\"#4f46e5\"/><text x=\"171.71428571428572\" y=\"32.04918032786884\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\" font-style=\"italic\">C</text></svg>\n                        <div class=\"text-[10px] text-slate-400 mt-1\"><i class=\"fa-solid fa-compass-drafting\"></i> Hình minh họa dựng từ TikZ</div>\n                    </div>\n                </div>\n                            </div></span></div></div>","options":[],"solution":"<div class=\"grid grid-cols-1 gap-2 my-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80\"><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">a)</span><span>[1.]</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">b)</span><span>Đồ thị hàm số $y = ax + b$ đi qua hai điểm $A(-1; 5)$ và $B(2; -1)$ nên ta có hệ phương trình:\n\t\t\t$$\\heva{&-a + b = 5 <br> &2a + b = -1}  \\heva{&3a = -6 <br> &b = a + 5}  \\heva{&a = -2 <br> &b = 3.}$$\n\t\t\tKiểm tra điều kiện hàm số bậc nhất: $a = -2 \\neq 0$ (thỏa mãn).<br>\n\t\t\tVậy hàm số bậc nhất cần tìm là $y = -2x + 3$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">c)</span><span>Xét $\\triangle ABC$ vuông tại $A$ (với $BC = 6\\text{ m}$ là chiều dài thang, $AC = 5{,}4\\text{ m}$ là khoảng cách từ đầu thang đến mặt đất).<br>\n\t\t\tGóc tạo bởi thang và mặt đất là $\\widehat{ABC}$. Ta có:\n\t\t\t$$\\sin B = \\dfrac{AC}{BC} = \\dfrac{5{,}4}{6} = 0{,}9 \\Rightarrow \\widehat{B} \\approx 64^\\circ 9'.$$\n\t\t\tVì $60^\\circ < 64^\\circ 9' < 70^\\circ$ nên việc đặt thang như vậy là <strong>an toàn</strong>.</span></div></div>"},{"id":23,"type":"Bài tập","level":"Nhận biết","stem":"[<strong>1,0 điểm</strong>]\n\tHai xí nghiệp theo kế hoạch phải làm tổng cộng $290$ dụng cụ. Thực tế, xí nghiệp I đã làm vượt mức kế hoạch $10\\%$, còn xí nghiệp II do gặp sự cố máy móc nên sản lượng bị giảm $12\\%$ so với kế hoạch. Vì vậy, cả hai xí nghiệp đã làm được tổng cộng $286$ dụng cụ. Tính số dụng cụ mỗi xí nghiệp phải làm theo kế hoạch.","options":[],"solution":"Gọi số dụng cụ xí nghiệp I và xí nghiệp II phải làm theo kế hoạch lần lượt là $x, y$ (dụng cụ) (Điều kiện: $x, y \\in \\mathbb{N}^*;\\ x, y < 290$).<br>\n\t\tTheo kế hoạch, hai xí nghiệp phải làm tổng cộng $290$ dụng cụ nên ta có phương trình:\n\t\t$$x + y = 290 \\quad (1)$$\n\t\tThực tế:\n\t\t<div class=\"grid grid-cols-1 gap-2 my-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80\"><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">•</span><span>Xí nghiệp I vượt mức $10\\%$ nên làm được: $x + 10\\%x = 1{,}1x$ (dụng cụ).</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">•</span><span>Xí nghiệp II giảm $12\\%$ nên làm được: $y - 12\\%y = 0{,}88y$ (dụng cụ).</span></div></div>\n\t\tVì cả hai xí nghiệp thực tế làm được $286$ dụng cụ nên ta có phương trình:\n\t\t$$1{,}1x + 0{,}88y = 286 \\quad (2)$$\n\t\tTừ $(1)$ và $(2)$, ta có hệ phương trình:\n\t\t$$\\heva{&x + y = 290 <br> &1{,}1x + 0{,}88y = 286}  \\heva{&0{,}88x + 0{,}88y = 255{,}2 <br> &1{,}1x + 0{,}88y = 286}  \\heva{&0{,}22x = 30{,}8 <br> &y = 290 - x}  \\heva{&x = 140 <br> &y = 150}\\ \\text{(thỏa mãn điều kiện).}$$\n\t\tVậy theo kế hoạch, xí nghiệp I phải làm $140$ dụng cụ, xí nghiệp II phải làm $150$ dụng cụ."},{"id":24,"type":"Bài tập","level":"Thông hiểu","stem":"[<strong>2,0 điểm</strong>]\n\tCho $\\triangle ABC$ vuông tại $A$ ($AB > AC$), $BC = 8\\text{ cm}, \\widehat{B} = 36^\\circ$.\n\t<div class=\"grid grid-cols-1 gap-2 my-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80\"><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">a)</span><span>[a)]</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">b)</span><span>Tính $AB, AC, \\widehat{C}$ (độ dài làm tròn $2$ chữ số thập phân).</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">c)</span><span>Kẻ đường cao $AH$, trên tia đối của $HA$ lấy điểm $D$. Kẻ $DK$ vuông góc $AB$ tại $K$. Chứng minh rằng $\\dfrac{\\tan C}{\\tan D} = \\dfrac{HB}{HC}$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">d)</span><span>Đường thẳng qua $H$ song song với $AB$ cắt cạnh $AC$ tại $E$. Chứng minh $\\dfrac{1}{HE^2} = \\dfrac{1}{AH^2} + \\dfrac{1}{HC^2}$.</span></div></div>","options":[],"solution":"\\begin{center}\n\t\t\t\n                <div class=\"p-3 bg-indigo-50/60 border border-indigo-200 rounded-xl text-center space-y-1.5 text-xs text-indigo-900\">\n                    <i class=\"fa-solid fa-shapes text-lg text-indigo-500\"></i>\n                    <div class=\"font-semibold\">Hình vẽ hình học (TikZ)</div>\n                    <details class=\"text-[10px] text-left text-slate-500 cursor-pointer\">\n                        <summary class=\"text-center text-indigo-600 underline\">Xem mã nguồn hình vẽ</summary>\n                        <pre class=\"mt-1 p-2 bg-slate-900 text-emerald-400 rounded overflow-x-auto font-mono\">\\begin{tikzpicture}[scale=1.1, font=\\footnotesize, line join=round, line cap=round]\n\t\t\t\t% Tính toán tọa độ chính xác theo góc B = 36 độ, BC = 6 (tỉ lệ vẽ)\n\t\t\t\t\\pgfmathsetmacro{\\bangle}{36}\n\t\t\t\t\\pgfmathsetmacro{\\BC}{6}\n\t\t\t\t\\pgfmathsetmacro{\\AB}{\\BC*cos(\\bangle)}\n\t\t\t\t\\pgfmathsetmacro{\\AC}{\\BC*sin(\\bangle)}\n\t\t\t\t\\pgfmathsetmacro{\\BH}{\\AB*cos(\\bangle)}\n\t\t\t\t\\pgfmathsetmacro{\\AH}{\\AB*sin(\\bangle)}\n\t\t\t\t\n\t\t\t\t\\coordinate (B) at (0,0);\n\t\t\t\t\\coordinate (C) at (\\BC,0);\n\t\t\t\t\\coordinate (H) at (\\BH,0);\n\t\t\t\t\\coordinate (A) at (\\BH,\\AH);\n\t\t\t\t\\coordinate (D) at (\\BH,-1.8); % Điểm D trên tia đối của HA\n\t\t\t\t\\coordinate (K) at ($(A)!(D)!(B)$);\n\t\t\t\t\\coordinate (E) at ($(A)!(H)!(C)$); % Vì HE // AB và AB vuông góc AC nên HE vuông góc AC tại E\n\t\t\t\t\n\t\t\t\t\\draw[thick] (A)--(B)--(C)--cycle;\n\t\t\t\t\\draw[thick] (A)--(D)--(K) (B)--(D) (H)--(E);\n\t\t\t\t\n\t\t\t\t% Ký hiệu góc vuông\n\t\t\t\t\\draw (A) -- ($(A)!0.25cm!(B)$) -- ($(A)!0.25cm!(B)+(A)!0.25cm!(C)-(A)$) -- ($(A)!0.25cm!(C)$) -- cycle;\n\t\t\t\t\\draw (H) rectangle ($(H)+(-0.22,0.22)$);\n\t\t\t\t\\draw (K) -- ($(K)!0.22cm!(D)$) -- ($(K)!0.22cm!(D)+(K)!0.22cm!(B)-(K)$) -- ($(K)!0.22cm!(B)$) -- cycle;\n\t\t\t\t\\draw (E) -- ($(E)!0.22cm!(H)$) -- ($(E)!0.22cm!(H)+(E)!0.22cm!(C)-(E)$) -- ($(E)!0.22cm!(C)$) -- cycle;\n\t\t\t\t\n\t\t\t\t\\pic[draw, \"$36^\\circ$\", angle eccentricity=1.4, angle radius=0.65cm] {angle = C--B--A};\n\t\t\t\t\n\t\t\t\t% Vòng lặp vẽ và đặt tên các điểm\n\t\t\t\t\\foreach \\p/\\pos in {A/above, B/left, C/right, H/below right, D/below, K/above left, E/above right}{\n\t\t\t\t\t\\fill (\\p) circle (1.5pt) node[\\pos] {$\\p$};\n\t\t\t\t}\n\t\t\t\\end{tikzpicture}</pre>\n                    </details>\n                </div>\n            \n\t\t\\end{center}\n\t\t<div class=\"grid grid-cols-1 gap-2 my-2 bg-slate-50/70 p-3 rounded-xl border border-slate-200/80\"><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">a)</span><span>[a)]</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">b)</span><span>Xét $\\triangle ABC$ vuông tại $A$, ta có:\n\t\t\t\\begin{itemize}</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">c)</span><span>$\\widehat{B} + \\widehat{C} = 90^\\circ \\Rightarrow \\widehat{C} = 90^\\circ - \\widehat{B} = 90^\\circ - 36^\\circ = 54^\\circ$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">d)</span><span>$AB = BC \\cdot \\cos B = 8 \\cdot \\cos 36^\\circ \\approx 6{,}47\\text{ (cm)}$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">e)</span><span>$AC = BC \\cdot \\sin B = 8 \\cdot \\sin 36^\\circ \\approx 4{,}70\\text{ (cm)}$.\n\t\t\t\\end{itemize}</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">f)</span><span><em>Nhận xét:</em> Nếu hiểu $\\tan D = \\tan\\widehat{ADB}$, trong $\\triangle BHD$ vuông tại $H$ ta có $\\tan\\widehat{HDB} = \\dfrac{HB}{HD}$, tỉ số sẽ phụ thuộc vào vị trí điểm $D$. Trong bài toán hình học chuẩn, góc tại $D$ là $\\widehat{ADK}$ (kẻ $DK \\perp AB$ tại $K$) và điểm $D$ lấy sao cho $AD$ hoặc hệ thức liên hệ qua $\\triangle AKD$:\n\t\t\t\\begin{itemize}</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">g)</span><span>Xét $\\triangle AHB$ vuông tại $H$ và $\\triangle AKD$ vuông tại $K$ có $\\widehat{BAH} = \\widehat{DAK}$ (đối đỉnh) nên $\\widehat{ABH} = \\widehat{ADK}$ (cùng phụ với hai góc bằng nhau).</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">h)</span><span>Mặt khác, trong $\\triangle ABC$ vuông tại $A$ đường cao $AH$, ta có $\\widehat{ABH} = \\widehat{CAH}$ (cùng phụ với $\\widehat{BAH}$). Suy ra $\\widehat{ADK} = \\widehat{CAH}$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">9.</span><span>Do đó: $\\tan\\widehat{ADK} = \\tan\\widehat{CAH} = \\dfrac{HC}{AH}$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">10.</span><span>Trong $\\triangle AHB$ vuông tại $H$, vì $\\widehat{C} = \\widehat{BAH}$ (cùng phụ với $\\widehat{B}$) nên $\\tan C = \\tan\\widehat{BAH} = \\dfrac{HB}{AH}$.</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">11.</span><span>Từ đó suy ra:\n\t\t\t\t$$\\dfrac{\\tan C}{\\tan\\widehat{ADK}} = \\dfrac{\\dfrac{HB}{AH}}{\\dfrac{HC}{AH}} = \\dfrac{HB}{HC}\\ \\text{(điều phải chứng minh).}$$\n\t\t\t\\end{itemize}</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">12.</span><span>Vì $HE \\parallel AB$ (giả thiết) và $AB \\perp AC$ (do $\\triangle ABC$ vuông tại $A$) nên $HE \\perp AC$ tại $E$.<br>\n\t\t\tXét $\\triangle AHC$ vuông tại $H$ có $HE$ là đường cao ứng với cạnh huyền $AC$:\n\t\t\t\\begin{itemize}</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">13.</span><span>Ta có: $\\sin C = \\dfrac{HE}{HC}$ (trong $\\triangle HEC$ vuông tại $E$) và $\\cos C = \\dfrac{HE}{AH}$ (vì $\\widehat{AHE} = \\widehat{C}$ do cùng phụ với $\\widehat{HAC}$, xét trong $\\triangle AHE$ vuông tại $E$).</span></div><div class=\"flex items-baseline gap-2 py-1\"><span class=\"font-bold text-indigo-700 shrink-0\">14.</span><span>Suy ra:\n\t\t\t\t$$\\dfrac{1}{AH^2} + \\dfrac{1}{HC^2} = \\dfrac{\\cos^2 C}{HE^2} + \\dfrac{\\sin^2 C}{HE^2} = \\dfrac{\\sin^2 C + \\cos^2 C}{HE^2} = \\dfrac{1}{HE^2}.$$\n\t\t\t\\end{itemize}\n\t\t\tVậy $\\dfrac{1}{HE^2} = \\dfrac{1}{AH^2} + \\dfrac{1}{HC^2}$ (điều phải chứng minh).</span></div></div>"},{"id":25,"type":"Bài tập","level":"Vận dụng cao","stem":"[<strong>0,5 điểm</strong>] \n\tCho các số thực $x, y, z$ thỏa mãn $3x^2 + 2y^2 + 2z^2 + 2yz = 3$. Tìm giá trị nhỏ nhất của biểu thức $S = x + y + z$.","options":[],"solution":"Từ giả thiết $3x^2 + 2y^2 + 2z^2 + 2yz = 3$, ta thực hiện phân tích và nhóm các hạng tử như sau:\n\t\t$$\\left(x^2 + y^2 + z^2 + 2xy + 2yz + 2zx\\right) + \\left(x^2 - 2xy + y^2\\right) + \\left(x^2 - 2zx + z^2\\right) = 3$$\n\t\tSử dụng các hằng đẳng thức đáng nhớ, phương trình trên tương đương với:\n\t\t$$(x + y + z)^2 + (x - y)^2 + (x - z)^2 = 3$$\n\t\tVì $(x - y)^2 \\ge 0$ và $(x - z)^2 \\ge 0$ với mọi số thực $x, y, z$, nên ta suy ra:\n\t\t$$(x + y + z)^2 \\le 3$$\n\t\tDo đó, miền giá trị của tổng $x + y + z$ được chặn trong đoạn:\n\t\t$$-\\sqrt{3} \\le x + y + z \\le \\sqrt{3}$$\n\t\tSuy ra $S = x + y + z \\ge -\\sqrt{3}$.\n\t\t\n\t\tDấu ``='' xảy ra khi và chỉ khi đồng thời có:\n\t\t$$\\begin{cases} \n\t\t\tx - y = 0 <br> \n\t\t\tx - z = 0 <br> \n\t\t\tx + y + z = -\\sqrt{3} \n\t\t\\end{cases} \\Leftrightarrow x = y = z = -\\dfrac{\\sqrt{3}}{3} = -\\dfrac{1}{\\sqrt{3}}$$\n\t\t\n\t\tVậy giá trị nhỏ nhất của $S$ là $-\\sqrt{3}$, đạt được tại $x = y = z = -\\dfrac{\\sqrt{3}}{3}$."}]};
        let exam = [], ans = {}, timer = null, sec = CONFIG.timeMins * 60;
        const L = ['A','B','C','D'];
        function start() {
            const n = document.getElementById('s-name').value.trim(), c = document.getElementById('s-class').value.trim(), p = document.getElementById('s-pass').value.trim();
            if (!n || !c) return alert("Vui lòng nhập đủ Họ tên và Lớp!");
            if (p !== CONFIG.pass) return alert("Sai mật khẩu mở đề!");
            exam = JSON.parse(JSON.stringify(CONFIG.pool));
            if (CONFIG.shuffleMode !== 'none') exam.sort(() => 0.5 - Math.random());
            if (CONFIG.shuffleMode === 'both') exam.forEach(q => q.options && q.options.sort(() => 0.5 - Math.random()));
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('quiz-box').classList.remove('hidden');
            document.getElementById('s-info').innerText = n + " - " + c;
            render();
            timer = setInterval(() => { sec--; document.getElementById('s-timer').innerText = Math.floor(sec/60)+":"+(sec%60).toString().padStart(2,'0'); if(sec<=0) grade(); }, 1000);
        }
        function render() {
            document.getElementById('q-list').innerHTML = exam.map((q, i) => q.options.length ? `
                <div class="p-5 border rounded-2xl space-y-3 bg-white shadow-sm">
                    <div class="font-bold text-xs text-indigo-700 uppercase">Câu ${i+1} (Trắc nghiệm):</div>
                    <div class="text-sm leading-relaxed">${q.stem}</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${q.options.map((o, j) => `
                        <div onclick="ans[${i}]=${j};render()" class="p-3 rounded-xl border-2 cursor-pointer text-xs flex items-center gap-2.5 ${ans[i]===j?'border-indigo-600 bg-indigo-50 font-bold':'bg-white border-slate-200'}">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 ${ans[i]===j?'bg-indigo-600 text-white':'bg-slate-200'}">${L[j]}</span>
                            <span>${o.text}</span>
                        </div>`).join('')}
                    </div>
                </div>` : `<div class="p-5 border rounded-2xl space-y-3 bg-white shadow-sm"><div class="font-bold text-xs text-teal-700 uppercase">Câu ${i+1} (Tự luận):</div><div class="text-sm leading-relaxed">${q.stem}</div><textarea oninput="ans[${i}]=this.value" rows="3" placeholder="Nhập bài làm hoặc đáp số..." class="w-full border rounded-xl p-3 text-xs bg-slate-50">${ans[i]||''}</textarea></div>`).join('');
            if (window.MathJax) MathJax.typesetPromise();
        }
        function grade() {
            clearInterval(timer);
            let mc = 0, right = 0;
            exam.forEach((q, i) => { if (q.options.length) { mc++; if (ans[i]!==undefined && q.options[ans[i]].isCorrect) right++; } });
            const sc = mc ? ((right/mc)*10).toFixed(2) : 10;
            document.getElementById('quiz-box').classList.add('hidden');
            const rb = document.getElementById('res-box'); rb.classList.remove('hidden');
            rb.innerHTML = `<div class="bg-indigo-900 text-white p-6 rounded-2xl text-center space-y-1"><div class="text-xs uppercase text-indigo-200">Điểm số của bạn</div><div class="text-4xl font-extrabold text-amber-400">${sc} / 10</div><div class="text-xs">Trắc nghiệm đúng: ${right}/${mc} câu</div></div>` +
            (CONFIG.reviewMode === 'full' ? exam.map((q, i) => `<div class="p-4 border rounded-xl space-y-2 text-xs"><div class="font-bold text-indigo-800">Câu ${i+1}:</div><div>${q.stem}</div>${q.solution?`<div class="p-3 bg-indigo-50 rounded-lg mt-2"><b>Lời giải chi tiết:</b><br>${q.solution}</div>`:''}</div>`).join('') : '');
            if (window.MathJax) MathJax.typesetPromise();
        }
    </script>
</body>
</html>
